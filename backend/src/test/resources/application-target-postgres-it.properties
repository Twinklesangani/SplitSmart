spring.datasource.url=${PG_TARGET_TEST_URL}
spring.datasource.username=${PG_TARGET_RUNTIME_USER}
spring.datasource.password=${PG_TARGET_RUNTIME_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.data-source-properties[sslmode]=verify-full
spring.datasource.hikari.data-source-properties[sslrootcert]=${PG_TARGET_CA}
spring.flyway.url=${PG_TARGET_TEST_URL}
spring.flyway.user=${PG_TARGET_MIGRATION_USER}
spring.flyway.password=${PG_TARGET_MIGRATION_PASSWORD}
spring.flyway.jdbc-properties[sslmode]=verify-full
spring.flyway.jdbc-properties[sslrootcert]=${PG_TARGET_CA}
spring.flyway.locations=classpath:db/postgresql
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.database.vendor=postgresql
app.security.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.security.login-source-limit=1000
app.security.login-target-limit=1000
app.security.registration-source-limit=1000
app.recovery.email.enabled=false
app.recovery.email.delivery-verified=false
server.address=127.0.0.1
