spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Fixture suites issue many synthetic auth calls. Abuse regression tests use small explicit budgets.
app.security.login-source-limit=1000
app.security.login-target-limit=1000
app.security.registration-source-limit=1000

# Real HTTP test listeners remain local to this machine.
server.address=127.0.0.1