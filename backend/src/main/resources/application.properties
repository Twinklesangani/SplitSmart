spring.application.name=SplitSmart
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.security.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/api/openapi

# JSON is bounded by RequestProtectionFilter, independently of form-post limits.
server.forward-headers-strategy=NONE
server.max-http-request-header-size=16KB
server.tomcat.max-parameter-count=50
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=10s
server.tomcat.threads.max=50
server.tomcat.max-connections=200
server.tomcat.accept-count=50
