# Runtime and migration connections use independent identities and verified TLS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties[sslMode]=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties[trustCertificateKeyStoreUrl]=${DB_TLS_TRUST_STORE_URL}
spring.datasource.hikari.data-source-properties[trustCertificateKeyStorePassword]=${DB_TLS_TRUST_STORE_PASSWORD}
spring.datasource.hikari.data-source-properties[trustCertificateKeyStoreType]=PKCS12

spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USERNAME}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.flyway.jdbc-properties[sslMode]=VERIFY_IDENTITY
spring.flyway.jdbc-properties[trustCertificateKeyStoreUrl]=${DB_TLS_TRUST_STORE_URL}
spring.flyway.jdbc-properties[trustCertificateKeyStorePassword]=${DB_TLS_TRUST_STORE_PASSWORD}
spring.flyway.jdbc-properties[trustCertificateKeyStoreType]=PKCS12

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
