# Activate with postgresql,postgres-prod; do NOT combine with the MySQL prod profile.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties[sslmode]=verify-full
spring.datasource.hikari.data-source-properties[sslrootcert]=${DB_TLS_CA_FILE}
spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USERNAME}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.flyway.jdbc-properties[sslmode]=verify-full
spring.flyway.jdbc-properties[sslrootcert]=${DB_TLS_CA_FILE}
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
