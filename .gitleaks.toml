condition = "AND"
paths = ['''(?:^|/)backend/src/main/resources/application-test\.properties$''']
regexTarget = "line"
regexes = ['''^app\.security\.jwt\.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=\r?$''']
